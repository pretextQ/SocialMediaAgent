name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -q

      # 确定性评测门槛（不需要 LLM 密钥）。
      # 工具选择 / 数据准确性 / 输出质量三项需要真实 LLM，CI 里没有密钥——
      # 这里刻意【不跑】，避免「假绿」；它们只在本地手动重跑（见 docs/eval/README.md）。
      - name: Retrieval quality gate (deterministic, no API key)
        run: >-
          python -m socialmedia_agent.evaluation.retrieval_runner
          --cases src/socialmedia_agent/evaluation/cases/retrieval.json
          --k 3 --min-recall 0.8 --min-mrr 0.8
