[project]
name = "socialmedia-agent"
version = "0.1.0"
description = "SocialMediaAgent - 多平台自媒体智能运营 Agent"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.0",
    "sqlalchemy>=2.0",
    "fastapi>=0.110",
    "httpx>=0.27",
    "langgraph>=1.0",
    "faiss-cpu>=1.10",
    "numpy>=2.0",
    "openai>=2.0",
    "apscheduler>=3.10",
    "mcp>=1.0,<2.0",
    "alembic>=1.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/socialmedia_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    "ignore:Field 'lifespan' has an incomplete definition:UserWarning",
]
